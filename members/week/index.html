<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ウィーク・ライブ</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <main class="app">
    <section class="stage-wrap">
      <canvas id="stage" width="1000" height="1000" aria-label="キリンのプレビュー"></canvas>
      <div class="status" id="status"><i></i><span>待機中</span></div>
      <button class="panel-toggle" id="panelToggle" aria-label="設定を開閉">⚙</button>
    </section>

    <aside class="panel" id="panel">
      <h1>ウィーク・ライブ</h1>
      <p class="lead">カメラの顔と口の動きにキリンがついてきます。</p>

      <button class="start" id="start">カメラを開始</button>
      <button class="secondary" id="demo">動きテスト</button>
      <div class="button-row">
        <button class="secondary" id="fullscreen">全画面表示</button>
        <button class="secondary" id="obsGreen">OBS・GB</button>
        <button class="secondary" id="obsBlue">OBS・BB</button>
      </div>

      <div class="meters">
        <label>口 <meter id="voiceMeter" min="0" max="1" value="0"></meter><output id="voiceValue">0%</output></label>
        <label>視線 <meter id="moveMeter" min="-1" max="1" value="0"></meter><output id="moveValue">0</output></label>
        <label>近さ <meter id="depthMeter" min="-1" max="1" value="0"></meter><output id="depthValue">0</output></label>
      </div>

      <details open>
        <summary>動きの調整</summary>
        <label class="slider">口の動き <input id="mouthAmount" type="range" min="0" max="40" value="22"><output>22</output></label>
        <label class="slider">体の追従 <input id="moveAmount" type="range" min="0" max="100" value="58"><output>58</output></label>
        <label class="slider">パーツの伸び <input id="stretchAmount" type="range" min="0" max="100" value="46"><output>46</output></label>
        <label class="slider">なめらかさ <input id="smoothAmount" type="range" min="0" max="95" value="76"><output>76</output></label>
      </details>

      <details>
        <summary>表示</summary>
        <label class="slider">大きさ <input id="sizeAmount" type="range" min="55" max="115" value="92"><output>92</output></label>
        <label class="check"><input id="mirror" type="checkbox" checked> すべて鏡合わせで動かす</label>
        <label class="check"><input id="showCamera" type="checkbox"> カメラを小さく表示</label>
        <label class="color">背景色 <input id="bgColor" type="color" value="#78c9b8"></label>
        <label class="check"><input id="transparent" type="checkbox"> 背景を透明にする（OBS向け）</label>
      </details>

      <p class="hint">OBSブラウザソース：<br>GB <code>http://127.0.0.1:8765/?obs=1&amp;bg=green</code><br>BB <code>http://127.0.0.1:8765/?obs=1&amp;bg=blue</code></p>
    </aside>
  </main>
  <video id="camera" playsinline muted></video>
  <script type="module" src="app.js?v=14"></script>
</body>
</html>
